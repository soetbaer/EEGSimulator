<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24405C"/>
      <stop offset="1" stop-color="#14202E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6D6"/>
      <stop offset="1" stop-color="#4AA8FF"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- feines Sekundenraster wie auf EEG-Papier -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
    <line x1="68" y1="24" x2="68" y2="232"/><line x1="128" y1="24" x2="128" y2="232"/><line x1="188" y1="24" x2="188" y2="232"/>
  </g>
  <!-- EEG-Kurve, die ein N bildet -->
  <path d="M 30 128 L 66 128 L 82 186 L 96 70 L 160 186 L 174 70 L 190 128 L 226 128"
        fill="none" stroke="url(#wave)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
