# Veröffentlicht die Version aus NeuroSim.vbproj als GitHub-Release (manuell starten:
# Actions → "Release veröffentlichen" → Run workflow, Branch main).
# Baut die Anwendung, führt die Tests aus und legt das Release mit Tag = Version,
# RELEASE_NOTES.md als Release-Text sowie NeuroSim.exe und NeuroSim.exe.sha256 als Dateien an.
# Die Update-Funktion findet es danach.
name: Release veröffentlichen

on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Bestehendes Release/Tag dieser Version löschen und neu veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # Releases gibt es nur vom Stand auf main
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version aus NeuroSim.vbproj lesen
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path "NeuroSim.vbproj" -Pattern '<Version>([0-9.]+)</Version>'
          $ver = $m.Matches[0].Groups[1].Value
          if (-not $ver) { throw "Version nicht gefunden" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Prüfen, dass es das Release noch nicht gibt
        if: ${{ !inputs.replace }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.version }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ steps.version.outputs.version }} existiert bereits (zum Ersetzen 'replace' setzen)" }
          exit 0

      - name: Tests
        run: dotnet test Tests/NeuroSim.Tests.vbproj -c Release

      - name: EXE erzeugen
        run: dotnet publish NeuroSim.vbproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none

      - name: Prüfsumme erzeugen
        shell: pwsh
        run: |
          $exe = "bin/Release/net8.0-windows/win-x64/publish/NeuroSim.exe"
          if (-not (Test-Path $exe)) { throw "$exe fehlt" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value "$hash  NeuroSim.exe" -Encoding ascii

      # Erst nach erfolgreichem Build und Tests löschen, damit kein Release fehlt, wenn es scheitert
      - name: Bestehendes Release ersetzen
        if: ${{ inputs.replace }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.version }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "${{ steps.version.outputs.version }}" --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Löschen fehlgeschlagen" }
          }
          exit 0

      - name: GitHub-Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dir = "bin/Release/net8.0-windows/win-x64/publish"
          gh release create $env:VERSION "$dir/NeuroSim.exe" "$dir/NeuroSim.exe.sha256" --target $env:GITHUB_SHA --title "NeuroSim $env:VERSION" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create fehlgeschlagen" }
